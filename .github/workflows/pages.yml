name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html assets .nojekyll _site/
          # Write the page text into the HTML in English (/) and Finnish (/fi/) for search engines.
          node tools/prerender.mjs _site "${{ steps.pages.outputs.base_url }}/"
          # Cache-bust CSS and JS so browsers load the new files after every deploy.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" _site/index.html _site/fi/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
