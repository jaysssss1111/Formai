name: Update news feed

# Collects AI news for the site's news carousel once a week
# (and whenever it is started by hand from the Actions tab).
on:
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect articles
        run: node tools/fetch-news.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/data/news.json; then
            echo "No new articles."
            exit 0
          fi
          git config user.name "formai news bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/news.json
          git commit -m "Update news feed"
          git push
